name: Publish Release

on:
  push:
    tags:
    - 'v*'
  # Voice chat fork: run from the Actions tab on the voice-chat branch. The release and its tag are created on the
  # commit that was built, so the tag can't end up pointing somewhere else.
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to create, e.g. v0.40.3-voice4"
        required: true

permissions:
  contents: write

jobs:
  build-windows-bootstrap:
    runs-on: windows-2022

    steps:
    - uses: actions/checkout@v3
      with:
        submodules: false

    - name: Setup .NET
      uses: actions/setup-dotnet@v3
      with:
        dotnet-version: 10.0.x

    - name: Publish bootstrap
      working-directory: SS14.Launcher.Bootstrap
      run: dotnet publish -r win-x64

    - uses: actions/upload-artifact@v4
      with:
        name: "bootstrap"
        retention-days: 1
        path: "SS14.Launcher.Bootstrap/bin/Release/net10.0-windows/win-x64/publish/SS14 Echoes of the Void Launcher.exe"

  build:
    runs-on: ubuntu-latest
    needs: build-windows-bootstrap

    steps:
    - name: Checkout code
      uses: actions/checkout@v2
      with:
        submodules: 'recursive'

    - name: Setup .NET
      uses: actions/setup-dotnet@v3
      with:
        dotnet-version: 10.0.x

    - name: Create build (macOS & Linux)
      run: ./publish.py osx linux

    - name: Download Windows Bootstrap
      uses: actions/download-artifact@v5
      with:
        name: "bootstrap"

    - name: Create build (Windows)
      run: ./publish.py windows --x64-only

    # Voice chat fork: works whether or not the release was already created from the GitHub web UI.
    - name: Publish release assets
      uses: softprops/action-gh-release@v2.0.8
      with:
        tag_name: ${{ inputs.tag || github.ref_name }}
        target_commitish: ${{ github.sha }}
        files: |
          ./EchoesOfTheVoid_Launcher_Linux.zip
          ./EchoesOfTheVoid_Launcher_Windows.zip
          ./EchoesOfTheVoid_Launcher_macOS.zip
